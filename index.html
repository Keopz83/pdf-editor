<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Viewer</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; grid-template: auto 1fr / 160px 1fr; font-family: system-ui, sans-serif; background: #eee; }
    header { grid-column: 1 / -1; padding: 0.75rem 1rem; background: #333; color: #fff; display: flex; gap: 1rem; align-items: center; }
    #toolbar { display: flex; flex-direction: column; gap: 0.5rem; padding: 1rem 0.75rem; background: #444; }
    #info { margin-left: auto; }
    #pages { overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 1rem; }
    .page { position: relative; max-width: 100%; }
    canvas { display: block; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); max-width: 100%; height: auto; }
    #pages.placing .page { cursor: crosshair; }
    .text-field { position: absolute; font-size: 14px; padding: 2px 4px; border: 1px dashed #36c; background: rgba(255, 255, 255, 0.8); }
    button.active { background: #36c; color: #fff; }
  </style>
</head>
<body>
  <header>
    <strong>PDF Viewer</strong>
    <span id="info"></span>
  </header>
  <aside id="toolbar">
    <button id="open-btn" type="button">Open</button>
    <input type="file" id="file" accept="application/pdf" hidden />
    <button id="text-field-btn" type="button">Text Field</button>
  </aside>
  <main id="pages"></main>

  <script type="module" src="main.js"></script>
</body>
</html>
