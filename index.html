<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <strong>PDF Viewer</strong>
    <span id="info"></span>
  </header>
  <aside id="toolbar">
    <button id="open-btn" type="button">Open</button>
    <input type="file" id="file" accept="application/pdf" hidden />
    <button id="save-btn" type="button" disabled>Save as</button>
    <button id="text-field-btn" type="button">Text Field</button>
    <fieldset id="text-options" hidden>
      <legend>Text field</legend>
      <label>Text color <input type="color" id="text-color" value="#000000" /></label>
      <label>Fill <input type="color" id="fill-color" value="#ffffff" disabled /></label>
      <label><input type="checkbox" id="fill-transparent" checked /> Transparent</label>
      <button id="delete-btn" type="button">Delete</button>
    </fieldset>
  </aside>
  <main id="pages"></main>

  <script type="module" src="main.js"></script>
</body>
</html>
