<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <strong>PDF Viewer</strong>
    <span id="info"></span>
  </header>
  <aside id="toolbar">
    <button id="open-btn" type="button">Open</button>
    <input type="file" id="file" accept="application/pdf" hidden />
    <button id="text-field-btn" type="button">Text Field</button>
  </aside>
  <main id="pages"></main>

  <script type="module" src="main.js"></script>
</body>
</html>
